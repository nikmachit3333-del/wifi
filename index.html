<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Connect</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background-color: #f5f5f7; color: #1d1d1f; }
        .card { max-width: 320px; margin: 50px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        img { width: 100%; max-width: 220px; border-radius: 12px; margin: 15px 0; }
        p { font-size: 14px; color: #6e6e73; line-height: 1.4; }
        .highlight { font-weight: 600; color: #0071e3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Wi-Fi-თან დაკავშირება</h2>
        <img src="qr.png.png" alt="Wi-Fi QR Code">
        <p><b>iPhone-ის მომხმარებლებო:</b> <span class="highlight">დააჭირეთ თითი QR კოდს და ეჭიროთ 1 წამი</span>, შემდეგ ამოფარებულ მენიუში აირჩიეთ <b>"Connect to Network"</b>.</p>
    </div>
</body>
</html>
